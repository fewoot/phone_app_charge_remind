<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="mint" data-bg="gradient">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>充电提醒 · 原型</title>
<link rel="stylesheet" href="styles.css">
<script>
  /* 首屏前先应用主题，避免闪烁 */
  try {
    var raw = localStorage.getItem('charge-reminder-proto-v2');
    if (raw) {
      var st = JSON.parse(raw);
      var s = st && st.settings;
      if (s) {
        var t = s.theme === 'auto'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : s.theme;
        document.documentElement.dataset.theme = t || 'light';
        document.documentElement.dataset.palette = s.palette || 'mint';
        document.documentElement.dataset.bg = s.bgType || 'gradient';
      }
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="phone-bezel">
      <div class="app" id="app">

        <div class="bg-gradient" id="bgGradient"></div>
        <div class="bg-photo" id="bgPhoto"></div>
        <div class="bg-dim" id="bgDim"></div>
        <div class="bg-top"></div>

        <div class="statusbar">
          <span id="sbTime">09:41</span>
          <span class="sb-icons">
            <svg width="64" height="14" viewBox="0 0 64 14" fill="currentColor" aria-hidden="true">
              <rect x="0" y="8" width="3" height="5" rx="1"></rect>
              <rect x="5" y="6" width="3" height="7" rx="1"></rect>
              <rect x="10" y="4" width="3" height="9" rx="1"></rect>
              <rect x="15" y="2" width="3" height="11" rx="1"></rect>
              <path d="M26 5.5c2.2-1.8 5-2.7 7.8-2.7s5.6.9 7.8 2.7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
              <path d="M28.8 8.5c1.4-1.1 3.1-1.7 5-1.7s3.6.6 5 1.7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
              <circle cx="33.9" cy="11.4" r="1.1"></circle>
              <rect x="47" y="3.2" width="13" height="7.6" rx="2.2" stroke="currentColor" stroke-width="1.2" fill="none"></rect>
              <rect x="49" y="5.2" width="9" height="3.6" rx="1"></rect>
              <rect x="61.4" y="5.6" width="1.6" height="2.8" rx=".8"></rect>
            </svg>
          </span>
        </div>
        <div class="punch"></div>

        <!-- ================= 首页 ================= -->
        <section class="screen is-active" id="screenHome">
          <header class="home-head">
            <div>
              <p class="home-date" id="homeDate">11月3日 周二</p>
              <h1 class="home-title">充电提醒</h1>
            </div>
            <button class="icon-btn" id="btnSettings" aria-label="设置">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
          </header>

          <div class="overview" id="overview"></div>
          <div class="device-list" id="deviceList"></div>
        </section>

        <!-- ================= 详情 ================= -->
        <section class="screen" id="screenDetail">
          <header class="page-head">
            <button class="icon-btn" data-back aria-label="返回">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <span class="page-title">设备详情</span>
            <button class="text-btn" id="btnEdit">编辑</button>
          </header>
          <div class="page-body" id="detailBody"></div>
        </section>

        <!-- ================= 编辑 ================= -->
        <section class="screen" id="screenEditor">
          <header class="page-head">
            <button class="icon-btn" data-back aria-label="返回">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <span class="page-title" id="editorTitle">添加设备</span>
            <span class="page-spacer"></span>
          </header>
          <div class="page-body" id="editorBody"></div>
        </section>

        <!-- ================= 设置 ================= -->
        <section class="screen" id="screenSettings">
          <header class="page-head">
            <button class="icon-btn" data-back aria-label="返回">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <span class="page-title">设置</span>
            <span class="page-spacer"></span>
          </header>
          <div class="page-body" id="settingsBody"></div>
        </section>

        <!-- FAB -->
        <button class="fab" id="btnAdd" aria-label="添加设备">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>

        <!-- 编辑页底部保存栏 -->
        <div class="sticky-actions is-hidden" id="editorActions">
          <button class="btn-primary" id="btnSave">保存</button>
        </div>
        <div class="home-indicator"></div>

        <!-- 遮罩 -->
        <div class="scrim" id="scrim"></div>

        <!-- 记录充电 -->
        <div class="sheet" id="sheetCharge" role="dialog" aria-modal="true">
          <div class="sheet-handle"></div>
          <h2 class="sheet-title">记录这次充电</h2>
          <p class="sheet-sub" id="chargeSub">充电宝 · 上次 10/22</p>

          <div class="field">
            <div class="field-label">现在还剩多少电？（可选）</div>
            <div class="pct-display" id="pctDisplay"><b id="chargePct">25</b><span>%</span></div>
            <input type="range" id="chargeRange" min="0" max="100" step="5" value="25" aria-label="剩余电量">
            <div class="chips" id="chargeChips">
              <button data-pct="10">10%</button>
              <button data-pct="20">20%</button>
              <button data-pct="30">30%</button>
              <button data-pct="50">50%</button>
              <button data-pct="none">不知道</button>
            </div>
            <p class="adaptive-hint" id="adaptiveHint"></p>
          </div>

          <div class="sheet-actions">
            <button class="btn-ghost" data-close-sheet>取消</button>
            <button class="btn-primary" id="btnConfirmCharge">保存</button>
          </div>
        </div>

        <!-- 确认弹窗 -->
        <div class="dialog" id="dialog" role="dialog" aria-modal="true">
          <h3 id="dialogTitle">确认</h3>
          <p id="dialogText"></p>
          <div class="dialog-actions">
            <button id="dialogCancel">取消</button>
            <button id="dialogOk" class="primary">确定</button>
          </div>
        </div>

        <div class="notification-layer" id="notificationLayer"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>
  <p class="stage-hint">交互原型 · 点右上角齿轮可以换背景 / 主题，点卡片进详情</p>
</div>

<input type="file" id="bgFileInput" accept="image/*" hidden>
<input type="file" id="iconFileInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
